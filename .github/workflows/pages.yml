# Builds the app and publishes it to GitHub Pages.
#
# The repo's own files aren't a site: packages/app/index.html points at /src/
# and main.js imports npm packages plus the collection2crate-plugins workspace
# (packages/plugins). So the workspace is installed, built with Vite, and
# packages/app/dist/ is what gets published.
#
# Pages' source has to be "GitHub Actions" (Settings → Pages) for the deploy
# job to publish.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      # PLUGINS is unset, so every plugin is built in (packages/app/SPEC.md §4.7a).
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
